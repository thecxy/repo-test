plugins {
    id 'com.android.library'
    id 'maven-publish'
}

android {
    namespace 'com.demo' // 自行修改包名
    compileSdk 34

    defaultConfig {
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        // 下面三行用于配置发布产物的基本信息
        buildConfigField "String", "VERSION_NAME", "\"1.0.0\""
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

// 发布用的 Maven 元信息
group = "com.demo"
version = "1.0.0"
archivesBaseName = "testaar" // 这决定 artifactId

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release

                // 手动设置 Maven 坐标
                groupId = project.group
                artifactId = project.archivesBaseName
                version = project.version
            }
        }

        repositories {
            maven {
                allowInsecureProtocol = true
                url "http://192.168.192.26:31068/repo/repository/0804-gradle-vr"
                credentials {
                    username "admin"
                    password "AP3d4ms8EPkNUMAMSZrto4jx7GB"
                }
            }
        }
    }
}

