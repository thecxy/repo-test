 plugins {
    id 'java'
    id 'java-library'
    id 'maven-publish'
}

// 关键：设置 group 和 version
group = 'com.example111'
version = '1.1.1'

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            // 使用项目group作为pom.groupId
            groupId project.group
            // 使用项目archivesBaseName作为pom.artifactId
            artifactId project.archivesBaseName
            // 使用项目version作为pom.version
            version project.version

            versionMapping {
                usage('java-api') {
                    fromResolutionOf('runtimeClasspath')
                }
                usage('java-runtime') {
                    fromResolutionResult()
                }
            }
        }
    }




    
